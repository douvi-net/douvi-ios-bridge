[package]
name = "douvi-ios-bridge"
version = "0.1.0-dev.1"
description = "Local-first Windows workbench for Flutter iOS builds"
authors = ["Douvi Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Cargo.lock and rust-toolchain.toml pin the native verification inputs.
