[package]
name = "douvi-ios-bridge"
version = "0.1.0-dev.1"
description = "Local-first Windows workbench for Flutter iOS builds"
authors = ["Douvi Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Resolve and commit Cargo.lock on the first native verification machine.
# No native build or dependency audit is claimed before that gate.
